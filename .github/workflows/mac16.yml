{"name":"build15i","on":["push","workflow_dispatch"],"jobs":{"build":{"runs-on":"macos-15-intel","steps":[{"uses":"actions/checkout@v4"},{"name":"deps","run":"brew install ldid xz dpkg"},{"name":"theos","run":"git clone --recursive --depth 1 https://github.com/roothide/theos ~/theos\necho THEOS=$HOME/theos >> $GITHUB_ENV\necho $HOME/theos/bin >> $GITHUB_PATH"},{"name":"sdk","run":"curl -sL https://github.com/theos/sdks/archive/master.tar.gz -o /tmp/sdks.tgz\nmkdir -p ~/theos/sdks && tar xzf /tmp/sdks.tgz -C ~/theos/sdks --strip-components=1"},{"name":"build","run":"make clean all FINALPACKAGE=1 _THEOS_PLATFORM_DPKG_DEB=dpkg-deb"},{"name":"pin","run":"set -e\nDYLIB=$(find .theos -path '*/WXChooser.dylib' -type f | grep -v '/_' | head -1)\necho target=$DYLIB\npython3 pin_integrity.py $DYLIB\nldid -S $DYLIB\npython3 pin_integrity.py $DYLIB\npython3 pin_integrity.py $DYLIB --verify"},{"name":"package","run":"set -e\nmake package FINALPACKAGE=1 _THEOS_PLATFORM_DPKG_DEB=dpkg-deb THEOS_PLATFORM_DEB_COMPRESSION_TYPE=xz\npython3 pin_integrity.py .theos/_/Library/MobileSubstrate/DynamicLibraries/WXChooser.dylib --verify"},{"uses":"actions/upload-artifact@v4","with":{"name":"WXChooser-deb15i","path":"packages/*.deb"}}]}}}
