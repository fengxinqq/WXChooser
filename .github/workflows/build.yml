name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: deps
        run: |
          sudo apt-get update
          sudo apt-get install -y make xz-utils libtinfo5 zlib1g-dev curl xz-utils
          curl -sL https://github.com/ProcursusTeam/ldid/releases/download/v2.1.5-procursus7/ldid_macosx_arm64 -o /tmp/x || true
          curl -sL https://github.com/ProcursusTeam/ldid/releases/download/v2.1.5-procursus7/ldid_linux_x86_64 -o /tmp/ldid && sudo mv /tmp/ldid /usr/local/bin/ldid && sudo chmod +x /usr/local/bin/ldid
          ldid -v || true
      - name: theos
        run: |
          git clone --recursive --depth 1 https://github.com/roothide/theos ~/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          echo "$HOME/theos/bin" >> $GITHUB_PATH
      - name: sdk
        run: |
          curl -sL https://github.com/theos/sdks/archive/master.tar.gz -o /tmp/sdks.tgz
          mkdir -p ~/theos/sdks && tar xzf /tmp/sdks.tgz -C ~/theos/sdks --strip-components=1
      - name: build
        run: make clean package FINALPACKAGE=1 _THEOS_PLATFORM_DPKG_DEB=dpkg-deb THEOS_PLATFORM_DEB_COMPRESSION_TYPE=xz
      - uses: actions/upload-artifact@v4
        with:
          name: WXChooser-deb
          path: packages/*.deb
